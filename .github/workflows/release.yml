name: Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: chickadee-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      release_needed: ${{ steps.version.outputs.release_needed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate version and check existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/release.py prepare

  windows-build:
    needs: version
    if: needs.version.outputs.release_needed == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      signed: ${{ steps.signature.outputs.signed }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: '0'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      APP_VERSION: ${{ needs.version.outputs.app_version }}
      SIGNPATH_READY: ${{ vars.SIGNPATH_ENABLED == 'true' && vars.SIGNPATH_ORGANIZATION_ID != '' && vars.SIGNPATH_PROJECT_SLUG != '' && vars.SIGNPATH_SIGNING_POLICY_SLUG != '' && 'true' || 'false' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Create Python environment
        run: python -m venv .venv
      - name: Install Python dependencies
        run: .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Install bundled Chromium
        run: .\.venv\Scripts\python.exe -m playwright install chromium --only-shell
      - name: Prepare verified official OCR models
        run: .\.venv\Scripts\python.exe scripts/prepare_ocr_models.py
      - name: Python regression tests
        run: ./scripts/test-python.ps1
      - name: Desktop unit tests
        working-directory: desktop
        run: npm test
      - name: Build Windows app and bundled engine
        run: ./scripts/build-desktop.ps1 -SkipInstall
      - name: Upload build for enrolled free code signing
        if: env.SIGNPATH_READY == 'true'
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-signpath-input
          path: artifacts/electron-${{ env.APP_VERSION }}/win-unpacked/
          compression-level: 0
          if-no-files-found: error
      - name: Request enrolled SignPath signing and wait for approval
        if: env.SIGNPATH_READY == 'true'
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 900
          output-artifact-directory: artifacts/signed-app
      - name: Accept signed binaries without changing application or design
        if: env.SIGNPATH_READY == 'true'
        run: |
          .\.venv\Scripts\python.exe scripts/accept_signed_app.py --original "artifacts/electron-$env:APP_VERSION/win-unpacked" --signed artifacts/signed-app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Windows code signatures before execution
        id: signature
        run: |
          $taskRequire = $env:SIGNPATH_READY -eq 'true'
          ./scripts/verify-windows-signatures.ps1 -AppDirectory "artifacts/electron-$env:APP_VERSION/win-unpacked" -AllNative:$taskRequire -RequireTrusted:$taskRequire
          $taskReport = Get-Content "artifacts/electron-$env:APP_VERSION/win-unpacked/windows-signatures.json" -Raw | ConvertFrom-Json
          $taskSigned = $taskReport.trusted -and $taskReport.all_native_checked
          "signed=$($taskSigned.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $taskSigned) { "Unsigned validation artifact only. Public release is held until free code signing is enrolled and verified." >> $env:GITHUB_STEP_SUMMARY }
      - name: Test packaged Windows app
        working-directory: desktop
        run: |
          $env:CHICKADEE_PACKAGED_EXE = Join-Path $env:GITHUB_WORKSPACE "artifacts/electron-$env:APP_VERSION/win-unpacked/Chickadee.exe"
          npm run smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/inspection-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/ocr-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/runtime-smoke.cjs
      - name: Package ZIP and SHA256
        run: .\.venv\Scripts\python.exe scripts/package-desktop.py
      - name: Verify release files
        run: python scripts/release.py verify --directory artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: |
            artifacts/Chickadee-Studio-${{ needs.version.outputs.app_version }}-win-x64.zip
            artifacts/Chickadee-Studio-${{ needs.version.outputs.app_version }}-win-x64.zip.sha256
          compression-level: 0
          if-no-files-found: error
      - name: Upload smoke test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-diagnostics
          path: |
            artifacts/*.png
            artifacts/*.log
            artifacts/python-tests/
          if-no-files-found: ignore

  publish-release:
    needs: [version, windows-build]
    if: needs.windows-build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      APP_VERSION: ${{ needs.version.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: windows-release-assets
          path: release-assets
      - name: Verify downloaded release files
        run: python scripts/release.py verify --directory release-assets
      - name: Publish Windows release
        run: |
          gh release create "v$APP_VERSION" \
            "release-assets/Chickadee-Studio-$APP_VERSION-win-x64.zip" \
            "release-assets/Chickadee-Studio-$APP_VERSION-win-x64.zip.sha256" \
            --repo "$GH_REPO" --target "$GITHUB_SHA" \
            --title "$APP_VERSION" \
            --notes-file "docs/releases/$APP_VERSION.md" --latest
