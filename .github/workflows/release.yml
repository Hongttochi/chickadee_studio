name: Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chickadee-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      release_needed: ${{ steps.version.outputs.release_needed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate version and check existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/release.py prepare

  windows-build:
    needs: version
    if: needs.version.outputs.release_needed == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BROWSERS_PATH: '0'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      APP_VERSION: ${{ needs.version.outputs.app_version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Create Python environment
        run: python -m venv .venv
      - name: Install Python dependencies
        run: .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Install bundled Chromium
        run: .\.venv\Scripts\python.exe -m playwright install chromium --only-shell
      - name: Python regression tests
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests -v
      - name: Desktop unit tests
        working-directory: desktop
        run: npm test
      - name: Build Windows app and bundled engine
        run: ./scripts/build-desktop.ps1 -SkipInstall
      - name: Test packaged Windows app
        working-directory: desktop
        run: |
          $env:CHICKADEE_PACKAGED_EXE = Join-Path $env:GITHUB_WORKSPACE "artifacts/electron-$env:APP_VERSION/win-unpacked/Chickadee.exe"
          npm run smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/inspection-smoke.cjs
      - name: Package ZIP and SHA256
        run: .\.venv\Scripts\python.exe scripts/package-desktop.py
      - name: Verify release files
        run: python scripts/release.py verify --directory artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: |
            artifacts/Chickadee-Studio-${{ needs.version.outputs.app_version }}-win-x64.zip
            artifacts/Chickadee-Studio-${{ needs.version.outputs.app_version }}-win-x64.zip.sha256
          compression-level: 0
          if-no-files-found: error
      - name: Upload smoke test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-diagnostics
          path: artifacts/*.png
          if-no-files-found: ignore

  publish-release:
    needs: [version, windows-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      APP_VERSION: ${{ needs.version.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: windows-release-assets
          path: release-assets
      - name: Verify downloaded release files
        run: python scripts/release.py verify --directory release-assets
      - name: Publish Windows release
        run: |
          gh release create "v$APP_VERSION" \
            "release-assets/Chickadee-Studio-$APP_VERSION-win-x64.zip" \
            "release-assets/Chickadee-Studio-$APP_VERSION-win-x64.zip.sha256" \
            --repo "$GH_REPO" --target "$GITHUB_SHA" \
            --title "$APP_VERSION" \
            --notes-file "docs/releases/$APP_VERSION.md" --latest
