name: Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: chickadee-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      release_needed: ${{ steps.version.outputs.release_needed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate version and check existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/release.py prepare

  windows-build:
    needs: version
    if: needs.version.outputs.release_needed == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BROWSERS_PATH: '0'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      APP_VERSION: ${{ needs.version.outputs.app_version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Create Python environment
        run: python -m venv .venv
      - name: Install Python dependencies
        run: .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Install bundled Chromium
        run: .\.venv\Scripts\python.exe -m playwright install chromium --only-shell
      - name: Prepare verified official OCR models
        run: .\.venv\Scripts\python.exe scripts/prepare_ocr_models.py
      - name: Python regression tests
        run: ./scripts/test-python.ps1
      - name: Desktop unit tests
        working-directory: desktop
        run: npm test
      - name: Build Windows app and bundled engine
        run: ./scripts/build-desktop.ps1 -SkipInstall
      - name: Record signature status without requiring signing
        run: |
          ./scripts/verify-windows-signatures.ps1 -AppDirectory "artifacts/electron-$env:APP_VERSION/win-unpacked"
          "Unsigned distribution. Signing enrollment is not requested or required. Windows security settings are unchanged." >> $env:GITHUB_STEP_SUMMARY
      - name: Package ZIP and SHA256
        run: .\.venv\Scripts\python.exe scripts/package-desktop.py
      - name: Verify release files
        run: python scripts/release.py verify --directory artifacts
      - name: Test Windows ZIP extraction
        run: |
          $ErrorActionPreference = 'Stop'
          $taskDestination = Join-Path $env:RUNNER_TEMP "Downloads/Chickadee-Studio-$env:APP_VERSION-win-x64"
          Expand-Archive -LiteralPath "artifacts/Chickadee-Studio-$env:APP_VERSION-win-x64.zip" -DestinationPath $taskDestination
          $taskApp = Join-Path $taskDestination "Chickadee-$env:APP_VERSION"
          $taskFiles = @(Get-ChildItem -LiteralPath $taskApp -Recurse -File)
          if (@($taskFiles | Where-Object { $_.FullName.Length -gt 259 }).Count) { throw 'Extracted Windows path is too long.' }
          $taskArchive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path "artifacts/Chickadee-Studio-$env:APP_VERSION-win-x64.zip"))
          try {
            if ($taskFiles.Count -ne $taskArchive.Entries.Count) { throw 'ZIP extraction omitted files.' }
          } finally { $taskArchive.Dispose() }
          $taskExe = Join-Path $taskApp 'Chickadee.exe'
          if (-not (Test-Path -LiteralPath $taskExe)) { throw 'Extracted app is missing.' }
          "CHICKADEE_PACKAGED_EXE=$taskExe" >> $env:GITHUB_ENV
          $taskLongest = ($taskFiles | ForEach-Object { $_.FullName.Length } | Measure-Object -Maximum).Maximum
          "Windows ZIP extraction passed: $($taskFiles.Count) files; longest path: $taskLongest characters." >> $env:GITHUB_STEP_SUMMARY
      - name: Test packaged Windows app
        working-directory: desktop
        run: |
          npm run smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/inspection-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/ocr-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/conditional-ocr-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/content-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/groq-env-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/login-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/runtime-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/record-service.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/recovery-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: |
            artifacts/Chickadee-Studio-${{ needs.version.outputs.app_version }}-win-x64.zip
            artifacts/Chickadee-Studio-${{ needs.version.outputs.app_version }}-win-x64.zip.sha256
          compression-level: 0
          if-no-files-found: error
      - name: Upload smoke test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-diagnostics
          path: |
            artifacts/*.png
            artifacts/*.log
            artifacts/python-tests/
          if-no-files-found: ignore

  publish-release:
    needs: [version, windows-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      APP_VERSION: ${{ needs.version.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: windows-release-assets
          path: release-assets
      - name: Verify downloaded release files
        run: python scripts/release.py verify --directory release-assets
      - name: Publish Windows release
        run: |
          gh release create "v$APP_VERSION" \
            "release-assets/Chickadee-Studio-$APP_VERSION-win-x64.zip" \
            "release-assets/Chickadee-Studio-$APP_VERSION-win-x64.zip.sha256" \
            --repo "$GH_REPO" --target "$GITHUB_SHA" \
            --title "$APP_VERSION" \
            --notes-file "docs/releases/$APP_VERSION.md" --latest
